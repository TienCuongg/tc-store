# ==============================================================================
# 🚀 TC SPORT BACKEND CONFIGURATION (SPRING BOOT 3 & MYSQL)
# ==============================================================================

# Server Port (Chạy ở cổng 8081 để tránh xung đột cổng 8080 của Vite Frontend)
server.port=8081

# App Info
spring.application.name=tcsport-backend

# ==============================================================================
# 🗄️ CẤU HÌNH CƠ SỞ DỮ LIỆU MYSQL (DATABASE CONNECTION)
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/tcsport_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=16032005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# ⚙️ HIBERNATE & JPA SETTINGS
# ==============================================================================
# Tự động tạo/cập nhật bảng dựa trên các Entity Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# 🔐 CẤU HÌNH JWT (JSON WEB TOKEN)
# ==============================================================================
# Khóa bí mật tối thiểu 256 bits dùng để mã hóa và xác thực chữ ký token
app.jwt.secret=9a7b5c3d1e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b
# Thời hạn token: 7 ngày (7 * 24 * 60 * 60 * 1000 = 604800000 ms)
app.jwt.expiration-ms=604800000

# ==============================================================================
# 📁 CẤU HÌNH UPLOAD FILE ẢNH SẢN PHẨM
# ==============================================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads

# Debug Spring Security Filter Chain
logging.level.org.springframework.security=DEBUG

# ==============================================================================
# 🤖 CẤU HÌNH GOOGLE GEMINI AI (MULTI-KEY ROTATION & AUTO-FAILOVER)
# ==============================================================================
gemini.api.keys=${GEMINI_API_KEYS:}
gemini.api.model=gemini-3.5-flash-lite

